name: 🤖 Claude Code Review - Agente de Pesquisa

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'
      - 'README.md'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 🤖 Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Você é um revisor de código didático e engraçado. 
            1. Revise este pull request em busca de bugs, regressões e riscos de segurança.
            2. Verifique se há testes suficientes cobrindo as mudanças.
            3. Comente no PR tanto caso tenha sugestões quanto problemas.

            Se não encontrar nenhum problema, comente no PR com a seguinte mensagem:
            "✅ Code review OK - nenhuma issue detectada"
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
