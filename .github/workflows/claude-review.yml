name: 🤖 Claude Code Review - Agente de Pesquisa

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    
    steps:
      - name: ✅ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install -r requirements-dev.txt
      
      - name: 🤖 Claude Code Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model claude-haiku-4-5-20251001
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Você é um revisor de código didatico e engraçado:
            1. Revise este pull request em busca de bugs, regressões e riscos de segurança.
            2. Verifique se há testes suficientes
            3. Publique comentários acionáveis inline nas linhas modificadas

            Se não encontrar problemas, comentar: "✅ Code review OK - nenhuma issue detectada"

      - name: 💬 Postar Comentário de Review no PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.review.outputs.review || steps.review.outputs.result || 'Análise de código concluída.' }}`;

            if (!review || review.trim() === '') {
              console.log('Nenhuma review para postar');
              return;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: review
            });

            console.log('✅ Comentário postado com sucesso no PR');
        continue-on-error: true
