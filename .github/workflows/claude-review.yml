name: 🤖 Claude Code Review - Agente de Pesquisa

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pyproject.toml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    
    steps:
      - name: ✅ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install -r requirements-dev.txt
      
      - name: 🤖 Claude Code Review
        run: |
          # Instalar Claude CLI se não estiver disponível
          if ! command -v claude &> /dev/null; then
            echo "📦 Instalando Claude CLI..."
            npm install -g @anthropic-ai/claude-cli
          fi

          # Executar code review com comentários diretos no PR
          echo "🔍 Iniciando análise de código..."
          claude /code-review --comment --effort high 2>&1 || true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true

      - name: 💬 Verificar Status do Review
        run: |
          echo "✅ Code review completado!"
          echo "📍 Verifique os comentários no PR #${{ github.event.pull_request.number }}"
